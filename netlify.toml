[build]
  command   = "python3 build.py"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  SITE_BASE = "https://velvetoctopusfilms.com"

# ── Security headers on every response ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security          = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options             = "nosniff"
    X-Frame-Options                    = "DENY"
    X-Permitted-Cross-Domain-Policies  = "none"
    Referrer-Policy                    = "strict-origin-when-cross-origin"
    Permissions-Policy                 = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy         = "same-origin"
    Cross-Origin-Resource-Policy       = "same-site"
    # CSP: no inline scripts, no external script hosts, YouTube iframe only
    Content-Security-Policy            = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

# ── Aggressive cache for fingerprinted assets ──────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML: never cache so deploys are instant ───────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Netlify functions: JSON only, no sniffing ──────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control          = "no-store"
